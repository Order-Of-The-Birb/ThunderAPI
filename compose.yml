services:
  thunderapi:
    build: .
    env_file:
      - .env
    environment:
      DEBUG_MODE: "0"
    user: "${UID:-1000}:${GID:-1001}"
      # Trust X-Forwarded-For from the Cloudflare tunnel so logs show the real client IP
      FORWARDED_ALLOW_IPS: "*"
    user: "${UID:-1000}:${GID:-1001}"
    volumes:
      - "./data:/data"
    ports:
      - "${HOST}:${PORT}:8000"
    restart: unless-stopped
