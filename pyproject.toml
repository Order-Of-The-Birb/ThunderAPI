[project]
name="ThunderAPI"
description="Translation layer for Gaijin Entertainment's servers"
version = "1.0.0"
requires-python = ">= 3.14"
authors = [
	{name = "Maho Yoshino", email="mahoyoshino@proton.me"}
]
readme = "README.md"
license = "Apache-2.0"

[project.urls]
Homepage = "https://thunderapi.mahoyoshino.hu"
Repository = "https://github.com/Order-Of-The-Birb/ThunderAPI.git"
Issues = "https://github.com/Order-Of-The-Birb/ThunderAPI/issues"

[dependency-groups]
dev = [
	"pytest",
	"pytest-asyncio",
	"ruff",
	"httpx"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
	"D211",
	"E4",
	"E7",
	"E9",
	"F",
	"I",
	"B",
	"FAST002",
	"PIE790",
	"PYI009",
	"PYI042",
	"Q000",
	"W2",
	"UP018",
	"UP039",
	"UP045",
	"RUF036",
	"TRY002",
	"TRY004"
]
