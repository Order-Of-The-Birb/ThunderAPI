[project]
name="ThunderAPI"
description="Translation layer for Gaijin Entertainment's servers"
version = "1.0.0"
requires-python = ">= 3.14"
authors = [
	{name = "Maho Yoshino", email="mahoyoshino@proton.me"}
]
readme = "README.md"
license = "Apache-2.0"

[project.urls]
Homepage = "https://thunderapi.mahoyoshino.hu"
Repository = "https://github.com/Order-Of-The-Birb/ThunderAPI.git"
Issues = "https://github.com/Order-Of-The-Birb/ThunderAPI/issues"

[dependency-groups]
dev = [
	"pytest",
	"pytest-asyncio",
	"ruff",
	"httpx"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore",
    "always::Warning:(src|utils|api|config|main|tests)",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"src/utils/vehicleParser/**/*.py" = [
    "E701",
    "F403",
    "F405",
    "F841",
]
